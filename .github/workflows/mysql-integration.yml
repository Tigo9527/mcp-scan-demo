name: MySQL integration

on:
  push:
    branches: [main, feat/mysql-support]
  pull_request:

jobs:
  mysql:
    runs-on: ubuntu-latest
    # 真连库测试要求目标库名以 _test 结尾（见 test/storage-mysql.test.ts 的 isDisposableTestDb），避免误清数据。
    env:
      RUN_MYSQL_TESTS: '1'
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: mcp_demo_test
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mcp_demo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
